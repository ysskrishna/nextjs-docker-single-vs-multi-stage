services:
  frontend-single-stage:
    build:
      context: .
      dockerfile: Dockerfile.single
    ports:
      - "3000:3000"
    environment:
      - NODE_ENV=production

  frontend-multi-stage:
    build:
      context: .
      dockerfile: Dockerfile.multi
    ports:
      - "3001:3000"
    environment:
      - NODE_ENV=production